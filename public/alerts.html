
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input, select, textarea, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .delete {
            background: #dc2626;
        }

        .update {
            background: #16a34a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eee;
        }

        #message {
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Alerts Management</h2>

    <h3>Create New Alert</h3>

    <form id="alertForm">

        <label>Study Area ID</label>
        <input type="number" id="study_area_id" required>

        <label>Threshold ID (Optional)</label>
        <input type="number" id="threshold_id">

        <label>Severity</label>
        <select id="severity" required>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>

        <label>Alert Message</label>
        <textarea id="alert_message" required></textarea>

        <button type="submit">Create Alert</button>

    </form>

    <p id="message"></p>

    <h3>Saved Alerts</h3>

    <button type="button" onclick="loadAlerts()">Refresh Alerts</button>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Study Area</th>
                <th>Severity</th>
                <th>Message</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody id="alertsTable"></tbody>
    </table>

</div>

<script>
    const API_URL = '/api/alerts';

    async function loadAlerts() {
        const table = document.getElementById('alertsTable');
        const message = document.getElementById('message');

        try {
            const response = await fetch(API_URL);
            const alerts = await response.json();

            if (!response.ok) {
                throw new Error(alerts.message || 'Failed to load alerts');
            }

            table.innerHTML = '';

            alerts.forEach(alert => {
                const row = document.createElement('tr');

                const values = [
                    alert.alert_id,
                    alert.area_name,
                    alert.severity,
                    alert.message,
                    alert.status
                ];

                values.forEach(value => {
                    const cell = document.createElement('td');
                    cell.textContent = value ?? '';
                    row.appendChild(cell);
                });

                const actions = document.createElement('td');

                const statusSelect = document.createElement('select');

                ['Open', 'Acknowledged', 'Resolved'].forEach(status => {
                    const option = document.createElement('option');
                    option.value = status;
                    option.textContent = status;
                    option.selected = alert.status === status;
                    statusSelect.appendChild(option);
                });

                const updateButton = document.createElement('button');
                updateButton.textContent = 'Update Status';
                updateButton.className = 'update';
                updateButton.onclick = () => updateAlert(alert.alert_id, statusSelect.value);

                const deleteButton = document.createElement('button');
                deleteButton.textContent = 'Delete';
                deleteButton.className = 'delete';
                deleteButton.onclick = () => deleteAlert(alert.alert_id);

                actions.appendChild(statusSelect);
                actions.appendChild(updateButton);
                actions.appendChild(deleteButton);

                row.appendChild(actions);
                table.appendChild(row);
            });

            if (alerts.length === 0) {
                table.innerHTML = '<tr><td colspan="6">No alerts found.</td></tr>';
            }

        } catch (error) {
            message.textContent = error.message;
        }
    }

    document.getElementById('alertForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const thresholdValue = document.getElementById('threshold_id').value;

        const data = {
            study_area_id: Number(document.getElementById('study_area_id').value),
            threshold_id: thresholdValue ? Number(thresholdValue) : null,
            severity: document.getElementById('severity').value,
            message: document.getElementById('alert_message').value
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            document.getElementById('message').textContent = result.message;

            if (response.ok) {
                this.reset();
                loadAlerts();
            }

        } catch (error) {
            document.getElementById('message').textContent = error.message;
        }
    });

    async function updateAlert(id, status) {
        try {
            const response = await fetch(`${API_URL}/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ status })
            });

            const result = await response.json();

            document.getElementById('message').textContent = result.message;

            if (response.ok) {
                loadAlerts();
            }

        } catch (error) {
            document.getElementById('message').textContent = error.message;
        }
    }

    async function deleteAlert(id) {
        if (!confirm('Are you sure you want to delete this alert?')) {
            return;
        }

        try {
            const response = await fetch(`${API_URL}/${id}`, {
                method: 'DELETE'
            });

            const result = await response.json();

            document.getElementById('message').textContent = result.message;

            if (response.ok) {
                loadAlerts();
            }

        } catch (error) {
            document.getElementById('message').textContent = error.message;
        }
    }

    loadAlerts();
</script>

</body>
</html>
